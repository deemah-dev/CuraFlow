<div class="custom-card p-6 max-w-md mx-auto">
  <h3 class="text-xl font-bold text-[#fff8c2] mb-4">Update Appointment Status</h3>

  <div
    *ngIf="errorMessage"
    class="bg-red-950/40 border border-red-500/50 text-red-200 px-4 py-3 rounded-lg mb-4 text-sm"
  >
    {{ errorMessage }}
  </div>

  <form [formGroup]="statusForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-2">Select New Status</label>
      <select
        formControlName="newStatus"
        class="w-full bg-[#0a0a0a] border border-[#73430b]/40 rounded-lg px-4 py-2.5 text-white focus:border-[#b38024] focus:outline-none transition-all"
      >
        <option value="" disabled>Select status</option>
        <option [value]="0">Pending / Scheduled</option>
        <option [value]="1">Confirmed</option>
        <option [value]="2">Completed</option>
        <option [value]="3">Cancelled</option>
      </select>
      <div
        *ngIf="statusForm.get('newStatus')?.touched && statusForm.get('newStatus')?.invalid"
        class="text-red-400 text-xs mt-1"
      >
        Please select a valid status.
      </div>
    </div>

    <div class="flex justify-end space-x-3 pt-2">
      <button
        type="button"
        (click)="onCancel()"
        class="px-4 py-2 rounded-lg border border-gray-600 text-gray-300 hover:bg-gray-800 transition-all text-sm"
      >
        Cancel
      </button>

      <button
        type="submit"
        [disabled]="isSubmitting"
        class="px-4 py-2 rounded-lg font-semibold bg-linear-to-r from-[#73430b] to-[#b38024] text-[#000000] hover:from-[#94570f] hover:to-[#73430b] transition-all text-sm disabled:opacity-50"
      >
        {{ isSubmitting ? 'Updating...' : 'Save Changes' }}
      </button>
    </div>
  </form>
</div>
